worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $ssl_client_s_dn $client_cn { ~CN=(?<cn>[^,/]+) $cn; default ""; }
    server {
        listen 10.0.50.14:3000 ssl;
        ssl_certificate        /opt/aeger/secrets/grafana-cert.pem;
        ssl_certificate_key    /opt/aeger/secrets/grafana-key.pem;
        ssl_client_certificate /opt/aeger/secrets/ca.pem;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            if ($client_cn != "nginx") { return 403; }
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
