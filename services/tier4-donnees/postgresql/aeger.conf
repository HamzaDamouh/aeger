# PostgreSQL 16 - AEGER - VM-DB-01
listen_addresses = '10.0.40.12,127.0.0.1'
port = 5432
max_connections = 60
password_encryption = scram-sha-256

# TLS : certificat délivré par Vault (Vault Agent)
ssl = on
ssl_cert_file = '/opt/aeger/secrets/postgres-cert.pem'
ssl_key_file  = '/opt/aeger/secrets/postgres-key.pem'
ssl_ca_file   = '/opt/aeger/secrets/ca.pem'
ssl_min_protocol_version = 'TLSv1.2'

# TimescaleDB (historique 7 jours) ; mémoire adaptée à une VM de 1 Go
shared_preload_libraries = 'timescaledb'
timescaledb.telemetry_level = off
shared_buffers = 128MB
effective_cache_size = 384MB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_buffers = 4MB
max_wal_size = 512MB
synchronous_commit = off
timescaledb.max_background_workers = 4
max_worker_processes = 12
log_timezone = 'Europe/Paris'
timezone = 'UTC'
