# Apache Kafka 4.3 - AEGER - VM-KAFKA-01 - mode KRaft, 1 nœud (broker + contrôleur)
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@127.0.0.1:9095
controller.listener.names=CONTROLLER

# Écoute TLS 9093 uniquement (VLAN 40) ; le contrôleur reste sur 127.0.0.1, lui aussi en TLS
listeners=SSL://10.0.40.11:9093,CONTROLLER://127.0.0.1:9095
advertised.listeners=SSL://vm-kafka-01:9093
listener.security.protocol.map=SSL:SSL,CONTROLLER:SSL
inter.broker.listener.name=SSL

# mTLS : certificat délivré par Vault (Vault Agent), client authentifié par son certificat
ssl.keystore.type=PEM
ssl.keystore.location=/opt/aeger/secrets/kafka.pem
ssl.truststore.type=PEM
ssl.truststore.location=/opt/aeger/secrets/ca.pem
ssl.client.auth=required
ssl.endpoint.identification.algorithm=https
ssl.enabled.protocols=TLSv1.2,TLSv1.3
# Identité Kafka = CN du certificat (ingestion, alerting, vitals, spark…)
ssl.principal.mapping.rules=RULE:^CN=([^,]+).*$/$1/,DEFAULT

# ACL : tout est interdit sauf ce qui est accordé (voir acl.sh)
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:kafka

# Stockage et rétention (3 jours : on peut relancer un traitement de nuit qui a échoué)
log.dirs=/var/lib/kafka/data
num.partitions=3
default.replication.factor=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
log.retention.hours=72
log.segment.bytes=268435456
auto.create.topics.enable=false
group.initial.rebalance.delay.ms=0
