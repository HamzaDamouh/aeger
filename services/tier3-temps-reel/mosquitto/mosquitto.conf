# mosquitto AEGER - écoute TLS 8883 sur l'adresse de VM-HOT-01 (VLAN 30)
per_listener_settings false
allow_anonymous false

listener 8883 10.0.30.11
protocol mqtt
cafile   /opt/aeger/secrets/ca.pem
certfile /opt/aeger/secrets/mosquitto-cert.pem
keyfile  /opt/aeger/secrets/mosquitto-key.pem
tls_version tlsv1.2
# Le certificat client est obligatoire ; son CN devient l'identité MQTT (hr-00042, ingestion…)
require_certificate true
use_identity_as_username true

# Droits : chaque bracelet n'écrit que dans son propre topic, ingestion lit tout
acl_file /mosquitto/config/acl

max_connections 5000
max_inflight_messages 100
max_queued_messages 10000
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false
