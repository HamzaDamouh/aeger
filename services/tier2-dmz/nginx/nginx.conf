# NGINX AEGER (VM-EDGE-01) - seule porte d'entrée depuis l'extérieur (Tier 1, adresse publique d'AEGER)
#  443  : navigateurs (TLS) -> application web, Keycloak, vitals, notification, Grafana
#  8443 : bracelets standards (mTLS, certificat du bracelet exigé) -> ingestion
#  8883 : bracelets haut risque, relais TCP vers mosquitto (TLS non terminé ici)
# Vers les services internes, NGINX présente son propre certificat (mTLS) et vérifie le leur.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 4096; }

stream {
    log_format mqtt '$remote_addr [$time_local] $status $bytes_sent/$bytes_received $session_time';
    access_log off;
    server {
        listen 8883;          # toutes les cartes : ufw n'ouvre 8883 que sur la carte publique
        proxy_pass vm-hot-01:8883;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;          # MQTT keepalive des bracelets : 60 s
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    access_log off;
    client_max_body_size 1m;

    # TLS côté clients
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate     /opt/aeger/secrets/nginx-cert.pem;
    ssl_certificate_key /opt/aeger/secrets/nginx-key.pem;
    ssl_session_cache shared:SSL:5m;

    # mTLS vers les services internes
    proxy_ssl_certificate         /opt/aeger/secrets/nginx-cert.pem;
    proxy_ssl_certificate_key     /opt/aeger/secrets/nginx-key.pem;
    proxy_ssl_trusted_certificate /opt/aeger/secrets/ca.pem;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_session_reuse on;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # CN du certificat client (bracelets standards) : "CN=std-00042" -> "std-00042"
    map $ssl_client_s_dn $client_cn { ~CN=(?<cn>[^,/]+) $cn; default ""; }

    # ------------------------------------------------------------- 443 : navigateurs
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        include /etc/nginx/security-headers.conf;

        # Application web du médecin (React)
        root /usr/share/nginx/html;
        location / {
            try_files $uri $uri/ /index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;
        }
        # fichiers versionnés de l'application (dist/assets/nom-HASH.js/css) : cache long
        location ^~ /assets/ {
            try_files $uri =404;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Keycloak (connexion OIDC des médecins et analystes)
        location ^~ /auth/ {
            proxy_pass https://vm-sec-01:8443;
            proxy_ssl_name vm-sec-01;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }

        # vitals : historique patient (jeton OIDC vérifié par le service)
        location ^~ /api/vitals/ {
            proxy_pass https://vm-hot-03:8000;
            proxy_ssl_name vm-hot-03;
        }

        # notification : alertes récentes + WebSocket des alertes en direct
        location ^~ /api/alerts/ {
            proxy_pass https://vm-hot-02:8000;
            proxy_ssl_name vm-hot-02;
        }
        location ^~ /ws/ {
            proxy_pass https://vm-hot-02:8000;
            proxy_ssl_name vm-hot-02;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Grafana : tableaux de bord KPI des analystes
        location ^~ /grafana/ {
            proxy_pass https://vm-cold-04:3000;
            proxy_ssl_name vm-cold-04;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # ------------------------------------------------------------- 8443 : bracelets standards (mTLS)
    server {
        listen 8443 ssl;
        server_name _;
        ssl_client_certificate /opt/aeger/secrets/ca.pem;
        ssl_verify_client on;
        ssl_verify_depth 2;

        location = /api/measures {
            # seuls les bracelets standards (CN std-NNNNN) sont admis ici
            if ($client_cn !~ "^std-[0-9]{5}$") { return 403; }
            limit_except POST { deny all; }
            proxy_pass https://vm-hot-01:8000/measures;
            proxy_ssl_name vm-hot-01;
            proxy_set_header X-Client-CN $client_cn;
        }
        location / { return 404; }
    }
}
